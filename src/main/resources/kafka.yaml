kafka:
  dev:
    bootstrap.servers:
      localhost:9092

    key.serializer:
      org.apache.kafka.common.serialization.StringSerializer

    value.serializer:
      org.springframework.kafka.support.serializer.JsonSerializer

    key.deserializer:
      org.apache.kafka.common.serialization.StringDeserializer

    value.deserializer:
      org.springframework.kafka.support.serializer.JsonDeserializer

    spring.json.use.type.headers:
      false

    spring.json.value.default.type:
      "dtu.services.library.config.events.Message"

    spring.json.trusted.packages:
      "dtu.services.*"

    spring.application.name:
      dtu-event-service

  test:
    bootstrap.servers:
      localhost:9092

    key.serializer:
      org.apache.kafka.common.serialization.StringSerializer

    value.serializer:
      org.springframework.kafka.support.serializer.JsonSerializer

    key.deserializer:
      org.apache.kafka.common.serialization.StringDeserializer

    value.deserializer:
      org.springframework.kafka.support.serializer.JsonDeserializer

    spring.json.use.type.headers:
      false

    spring.json.value.default.type:
      "dtu.services.library.config.events.Message"

    spring.json.trusted.packages:
      "dtu.services.*"

    spring.application.name:
      dtu-event-service

  prod:
    bootstrap.servers:
      localhost:9092

    key.serializer:
      org.apache.kafka.common.serialization.StringSerializer

    value.serializer:
      org.springframework.kafka.support.serializer.JsonSerializer

    key.deserializer:
      org.apache.kafka.common.serialization.StringDeserializer

    value.deserializer:
      org.springframework.kafka.support.serializer.JsonDeserializer

    spring.json.use.type.headers:
      false

    spring.json.value.default.type:
      "dtu.services.library.config.events.Message"

    spring.json.trusted.packages:
      "dtu.services.*"

    spring.application.name:
      dtu-event-service